<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DBD大会サイト</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <div class="site-header__inner">
            <h1>ふろぐCup</h1>
            <p>Dead by Daylight コミュニティ大会ポータル</p>
        </div>
    </header>

    <main class="page-shell">

        <section class="card card--featured">
            <div class="content-section content-section--status">
                <h2>開催状況</h2>

                <p class="status-label">
                    現在準備中
                </p>

                <p class="status-detail">
                    次回開催日：未定
                </p>
            </div>

            <div class="content-section">
                <h2>大会概要</h2>
                <p>
                    ふろぐCupは、Dead by Daylightのコミュニティ大会です。
                    他の主要大会が少ない時期を中心に、不定期で開催予定です。
                </p>
                <p>
                    参加形式は、最低4人からのチーム参加です。
                    先攻・後攻を同時に行う形式の場合は、5人チーム限定となります。
                </p>
            </div>

            <div class="content-section">
                <h2>お知らせ</h2>

                <ul class="notice-list">
                    <li>大会サイト公開</li>
                    <li>ルール作成中</li>
                    <li>Discordサーバー準備中</li>
                </ul>
            </div>
        </section>

        <section class="card menu-card">
            <h2>メニュー</h2>

            <nav class="menu-grid" aria-label="主要メニュー">
                <a class="button button--primary" href="rules.html">
                    大会ルール
                </a>

                <a class="button" href="#">
                    キラー事前制限アンケート
                </a>

                <a class="button" href="#">
                    キラー制限一覧
                </a>

                <a class="button" href="#">
                    Discordサーバー準備中
                </a>
            </nav>
        </section>

    </main>

</body>
</html>
